<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1050" width="2200" height="1050" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Filtre ombre douce pour relief professionnel -->
    <filter id="pkg-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-color="#887700" flood-opacity="0.12"/>
    </filter>

    <!-- Marqueur flèche ouverte pour dépendance UML <<access>> / <<merge>> -->
    <marker id="pkg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#5555bb" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <style>
    .pkg-tab { fill: #fffde0; stroke: #997300; stroke-width: 1.5; }
    .pkg-body { fill: #fffde0; stroke: #997300; stroke-width: 1.5; filter: url(#pkg-shadow); }
    .pkg-body-main { fill: #fffcc7; stroke: #997300; stroke-width: 2.2; filter: url(#pkg-shadow); }
    .pkg-title { font-size: 12.5px; font-weight: bold; fill: #111111; text-anchor: middle; letter-spacing: 0.5px; }
    .pkg-title-main { font-size: 14.5px; font-weight: bold; fill: #111111; text-anchor: middle; letter-spacing: 0.7px; }
    .dep-line { stroke: #5555bb; stroke-width: 1.4; stroke-dasharray: 6,4; fill: none; }
    .stereo-bg { fill: #ffffff; stroke: #bbbbdd; stroke-width: 0.6; rx: 3; ry: 3; }
    .stereo-text { font-size: 10.5px; font-style: italic; font-weight: 600; fill: #333388; text-anchor: middle; }
  </style>

