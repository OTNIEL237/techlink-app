name: Mobile CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'mobile/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./mobile

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.22.x' # Ou la version utilisée par le projet
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Analyze project source
      run: flutter analyze
      
    - name: Run tests
      run: flutter test
